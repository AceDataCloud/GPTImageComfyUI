[project]
name = "gpt-image"
version = "0.1.1"
description = "GPT Image generation and editing, same-task lookup, and native image loading through Ace Data Cloud"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/GPTImageComfyUI"
Documentation = "https://github.com/AceDataCloud/GPTImageComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/GPTImageComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "GPT Image by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/GPTImageComfyUI/main/assets/logo-400.png"
